# Sirve la exportación web de Expo. Las rutas que no son archivos (por ejemplo /groups/<id>)
# caen en index.html y las resuelve Expo Router en el navegador.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  location /_expo/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
